name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          jar=$(find build/libs -name '*.jar' ! -name '*-sources.jar')
          mc_version=$(grep 'minecraft_version' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          gh release create "$GITHUB_REF_NAME" \
            --title "BedrockCracker $GITHUB_REF_NAME for Minecraft $mc_version" \
            --generate-notes \
            "$jar"
