name: Release

on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

env:
  MC_VERSIONS: "26.3, 26.2, 26.1.2"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc_version: "26.3"
            fabric_version: "0.161.0+26.3"
          - mc_version: "26.2"
            fabric_version: "0.161.0+26.2"
          - mc_version: "26.1.2"
            fabric_version: "0.155.3+26.1.2"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build -Pminecraft_version=${{ matrix.mc_version }} -Pfabric_version=${{ matrix.fabric_version }}

      - name: Rename jar per target version
        run: |
          jar=$(find build/libs -name '*.jar' ! -name '*-sources.jar')
          mv "$jar" build/libs/BedrockCracker-mc${{ matrix.mc_version }}.jar

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: BedrockCracker-mc${{ matrix.mc_version }}
          path: build/libs/*.jar

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all built jars
        uses: actions/download-artifact@v7
        with:
          merge-multiple: true
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la dist
          gh release create "$GITHUB_REF_NAME" \
            --title "BedrockCracker $GITHUB_REF_NAME for Minecraft $MC_VERSIONS" \
            --generate-notes \
            dist/*.jar
